<div class="absolute -bottom-1 -right-1 flex items-center justify-center w-6 h-6 rounded-full bg-surface-container-lowest shadow-md">

<!-- Auth Mode Segmented Control -->
<div class="w-full bg-surface-container-lowest p-1 rounded-xl shadow-inner flex">
<button class="flex-1 py-2 rounded-lg bg-surface-container text-primary font-headline-sm text-label-md transition-all shadow-sm flex items-center justify-center space-x-1.5" id="tab-phone" type="button">
<span class="material-symbols-outlined text-[16px]">call</span>
<span>По номеру телефона</span>
</button>
<button class="flex-1 py-2 rounded-lg text-on-surface-variant font-headline-sm text-label-md transition-all flex items-center justify-center space-x-1.5 hover:text-on-surface" id="tab-account" type="button">
<span class="material-symbols-outlined text-[16px]">badge</span>
<span>Лицевой счет</span>
</button>

<!-- Interactive Credentials Form Container -->
<div class="w-full bg-surface-container-low p-space-md rounded-xl shadow-lg space-y-space-md">
<!-- Phone / Account Input Block -->
<div class="space-y-1.5" id="input-container-main">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" id="main-label">Абонентский номер</label>

</span>
</div>
<div class="flex items-center bg-surface-container-lowest rounded-lg px-space-sm py-2.5 shadow-inner focus-within:bg-surface-container-high transition-colors">
<div class="flex items-center space-x-1.5 pr-space-sm mr-space-xs text-on-surface" id="flag-pill">

<input autocomplete="tel" class="w-full bg-transparent font-label-lg text-label-lg text-on-surface placeholder:text-outline outline-none tracking-wider" id="phone-input" maxlength="15" placeholder="(___) ___-__-__" type="tel"/>
<button class="text-outline hover:text-on-surface p-1 hidden" id="clear-btn" type="button">

<div class="space-y-1.5">

<label class="font-label-md text-label-md text-on-surface-variant">Пароль доступа или SMS-код</label>
<button class="font-label-sm text-label-sm text-primary hover:underline" type="button">
          Забыли пароль?
        </button>
</div>
<div class="flex items-center bg-surface-container-lowest rounded-lg px-space-sm py-2.5 shadow-inner focus-within:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-outline text-[20px] mr-space-xs">lock</span>
<input class="w-full bg-transparent font-label-lg text-label-lg text-on-surface placeholder:text-outline outline-none tracking-widest" id="password-input" placeholder="••••••••" type="password"/>
<button class="text-outline hover:text-primary transition-colors p-1 flex items-center justify-center" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action (CTA) -->
<div class="pt-space-xs">
<button class="w-full py-3.5 rounded-lg bg-gradient-to-r from-primary-container via-tertiary-container to-secondary text-on-primary font-headline-sm text-headline-sm flex items-center justify-center space-x-2 shadow-lg shadow-primary-container/20 active:scale-[0.99] transition-all" id="submit-cta" type="button">
<span class="material-symbols-outlined text-[20px]">login</span>
<span>Войти в систему</span>
</button>
</div>
<!-- Quick Biometrics Access Trigger -->
<div class="relative flex items-center justify-center pt-space-xs">
<div class="absolute inset-x-0 top-1/2 h-px bg-surface-container-highest"></div>
<span class="relative bg-surface-container-low px-space-sm font-label-sm text-label-sm text-outline tracking-wider uppercase">быстрый доступ</span>
</div>
<button class="w-full py-3 rounded-lg bg-surface-container-high hover:bg-surface-container hover:shadow-lg transition-all flex items-center justify-center space-x-3 text-on-surface shadow-md group" id="biometrics-btn" type="button">
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[24px] group-hover:scale-110 transition-transform">fingerprint</span>

</div>
<div class="flex flex-col items-start text-left">
<span class="font-headline-sm text-label-md text-on-surface">Face ID / Touch ID</span>

</div>
<span class="material-symbols-outlined text-outline text-[18px] ml-auto">lock_open</span>
</button>
</div>
<!-- Auxiliary Links & Device Key Registration -->
<div class="flex flex-col items-center justify-center space-y-space-xs pt-space-xs">
<button class="font-body-md text-body-md text-primary hover:text-primary-fixed transition-colors flex items-center space-x-1.5" type="button">
<span class="material-symbols-outlined text-[18px]">person_add</span>
<span class="font-headline-sm text-label-md">Регистрация нового абонента</span>
</button>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center px-space-md">

    </p>

<!-- High-Precision Telemetry & Trust Footer -->
<div class="mt-auto pt-space-md flex flex-col items-center justify-center space-y-1.5 text-center">
<div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-surface-container-lowest shadow-sm">
<span class="material-symbols-outlined text-secondary text-[14px]">verified_user</span>
<span class="font-label-sm text-label-sm text-secondary font-medium tracking-wide">TLS 1.3 / ГОСТ 34.12-2015</span>
</div>
<div class="flex items-center space-x-2 text-outline font-label-sm text-label-sm">
<span>ru.domofondar.app</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>v1.0.4 (Expo SDK 52)</span>
</div>
</div>
</div>
<script>
  (function initDomofondarAuth() {
    const tabPhone = document.getElementById('tab-phone');
    const tabAccount = document.getElementById('tab-account');
    const mainLabel = document.getElementById('main-label');
    const flagPill = document.getElementById('flag-pill');
    const phoneInput = document.getElementById('phone-input');
    const clearBtn = document.getElementById('clear-btn');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');
    const passwordInput = document.getElementById('password-input');
    const pwdIcon = document.getElementById('pwd-icon');
    const biometricsBtn = document.getElementById('biometrics-btn');
    const submitCta = document.getElementById('submit-cta');

    let activeTab = 'phone';

    // Segmented Switching
    tabPhone.addEventListener('click', () => {
      if (activeTab === 'phone') return;
      activeTab = 'phone';
      tabPhone.className = "flex-1 py-2 rounded-lg bg-surface-container text-primary font-headline-sm text-label-md transition-all shadow-sm flex items-center justify-center space-x-1.5";
      tabAccount.className = "flex-1 py-2 rounded-lg text-on-surface-variant font-headline-sm text-label-md transition-all flex items-center justify-center space-x-1.5 hover:text-on-surface";
      mainLabel.textContent = "Абонентский номер";
      flagPill.style.display = "flex";
      phoneInput.placeholder = "(___) ___-__-__";
      phoneInput.value = "";
      phoneInput.type = "tel";
      clearBtn.classList.add('hidden');
    });

    tabAccount.addEventListener('click', () => {
      if (activeTab === 'account') return;
      activeTab = 'account';
      tabAccount.className = "flex-1 py-2 rounded-lg bg-surface-container text-primary font-headline-sm text-label-md transition-all shadow-sm flex items-center justify-center space-x-1.5";
      tabPhone.className = "flex-1 py-2 rounded-lg text-on-surface-variant font-headline-sm text-label-md transition-all flex items-center justify-center space-x-1.5 hover:text-on-surface";
      mainLabel.textContent = "Номер лицевого счета (10 цифр)";
      flagPill.style.display = "none";
      phoneInput.placeholder = "000-000-0000";
      phoneInput.value = "";
      phoneInput.type = "text";
      clearBtn.classList.add('hidden');
    });

    // Formatting mask for phone
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/\D/g, '');
      if (activeTab === 'phone') {
        if (val.length > 10) val = val.substring(0, 10);
        let formatted = '';
        if (val.length > 0) formatted += '(' + val.substring(0, 3);
        if (val.length >= 4) formatted += ') ' + val.substring(3, 6);
        if (val.length >= 7) formatted += '-' + val.substring(6, 8);
        if (val.length >= 9) formatted += '-' + val.substring(8, 10);
        e.target.value = formatted;
      }
      clearBtn.classList.toggle('hidden', e.target.value.length === 0);
    });

    clearBtn.addEventListener('click', () => {
      phoneInput.value = '';
      clearBtn.classList.add('hidden');
      phoneInput.focus();
    });

    // Password visibility toggle
    togglePwdBtn.addEventListener('click', () => {
      const isPwd = passwordInput.type === 'password';
      passwordInput.type = isPwd ? 'text' : 'password';
      pwdIcon.textContent = isPwd ? 'visibility_off' : 'visibility';
    });

    // Biometrics Pulse feedback
    biometricsBtn.addEventListener('click', () => {
      const originalText = biometricsBtn.querySelector('.text-label-md').textContent;
      const titleEl = biometricsBtn.querySelector('.text-label-md');
      titleEl.textContent = "Инициализация Face ID...";
      biometricsBtn.classList.add('ring-2', 'ring-secondary');
      setTimeout(() => {
        titleEl.textContent = "Успешная верификация";
        biometricsBtn.classList.remove('ring-2', 'ring-secondary');
        setTimeout(() => {
          titleEl.textContent = originalText;
        }, 1500);
      }, 900);
    });

    // CTA micro feedback
    submitCta.addEventListener('click', () => {
      const originalHtml = submitCta.innerHTML;
      submitCta.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>Авторизация...</span>';
      submitCta.disabled = true;
      setTimeout(() => {
        submitCta.innerHTML = originalHtml;
        submitCta.disabled = false;
      }, 1200);
    });
  })();
</script></main></body></html>
