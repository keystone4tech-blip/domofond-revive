# ==============================================================================
# КОНФИГУРАЦИЯ NGINX ВЕБ-СЕРВЕРА ДЛЯ ПРОЕКТА «ДОМОФОНДАР» (домофондар.рф)
# ==============================================================================

# Ограничение частоты запросов для защиты от перебора паролей (Brute Force)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. Сервер HTTP (порты 80 и 8080)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen 8080;
    listen 443 ssl;
    server_name 45.8.99.238.sslip.io 45.8.99.238 xn--80aha5afebav9a.xn--p1ai www.xn--80aha5afebav9a.xn--p1ai domofondar.ru www.domofondar.ru localhost;

    # SSL сертификаты (Let's Encrypt для 45.8.99.238.sslip.io)
    ssl_certificate /etc/letsencrypt/live/45.8.99.238.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/45.8.99.238.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Проверка Let's Encrypt Certbot для выпуска и автопродления SSL-сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Поддержка React Router (SPA history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование к PostgREST (внутренний порт 3000)
    location /api/rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://postgrest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование к Auth & API бэкенду (внутренний порт 5000)
    location /backend-api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Увеличенный таймаут для создания и скачивания больших дампов базы данных
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Ограничение частоты запросов для авторизации
    location /backend-api/api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:5000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Отключение кэширования Service Worker и HTML
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Долгосрочное кэширование статических ассетов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Обслуживание документов
    location ~* \.(pdf|doc|docx|xls|xlsx)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
}
