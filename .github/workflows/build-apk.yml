# .github/workflows/build-apk.yml
# Автоматическая сборка подписанного APK мобильного приложения «Домофондар» для Android
# Сборка выполняется на облачных серверах GitHub Actions с сохранением готового .apk
# в GitHub Releases (прямая ссылка в 1 клик), в артефактах GitHub и на сервере домофондар.рф

name: 📱 Сборка Android APK (Домофондар)

on:
  # Возможность запускать сборку вручную во вкладке Actions
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки (release - автономный оптимизированный APK / debug - отладочный)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

  # Автоматическая сборка при коммите изменений в мобильное приложение
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

# Права на публикацию релизов на GitHub
permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Сборка установочного APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # 1. Клонирование репозитория
      - name: 📥 Получение исходного кода
        uses: actions/checkout@v4

      # 2. Настройка Node.js (современная стабильная версия 22)
      - name: 🟢 Настройка Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      # 3. Настройка Java JDK 17
      - name: ☕ Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Настройка Android SDK Build-Tools и кеширование Gradle
      - name: 🤖 Подготовка Android SDK
        uses: android-actions/setup-android@v3

      # 5. Установка npm зависимостей мобильного приложения
      - name: 📦 Установка зависимостей мобильного приложения
        run: |
          echo "[CI/CD] Установка зависимостей в директории mobile..."
          cd mobile
          npm install --legacy-peer-deps

      # 6. Синхронизация нативного проекта Expo (без флага --clean, сохраняя настройки Gradle и подписи)
      - name: ⚙️ Синхронизация нативного Android проекта (Expo Prebuild)
        run: |
          echo "[CI/CD] Запуск Expo Prebuild для генерации ассетов и манифеста..."
          cd mobile
          npx expo prebuild --platform android --no-install

      # 7. Выдача прав на выполнение скрипта сборки Gradle
      - name: 🔑 Выдача прав на gradlew
        run: |
          cd mobile/android
          chmod +x gradlew

      # 8. Компиляция установочного APK файла (с компиляцией JS-бандла и оптимизациями Hermes)
      - name: 🔨 Компиляция автономного APK через Gradle
        run: |
          cd mobile/android
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "[CI/CD] Запуск компиляции APK (тип сборки: $BUILD_TYPE)..."
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # 9. Поиск, подпись, выравнивание zipalign и валидация APK
      - name: 🔐 Проверка, подпись и валидация APK
        run: |
          mkdir -p mobile-artifacts
          echo "[CI/CD] Поиск скомпилированных .apk файлов:"
          find mobile/android/app/build/outputs/apk -name "*.apk"
          
          # Находим сгенерированный APK файл
          RAW_APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "[CI/CD] ОШИБКА: Файл APK не найден в build/outputs/apk!"
            exit 1
          fi
          echo "[CI/CD] Найден исходный APK: $RAW_APK"
          
          # Определяем пути к утилитам Android SDK
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "[CI/CD] Используются Build-Tools: $BUILD_TOOLS_DIR"
          
          # Проверяем, подписан ли APK
          VERIFY_OUTPUT=$("$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RAW_APK" 2>&1 || true)
          echo "$VERIFY_OUTPUT"
          
          if echo "$VERIFY_OUTPUT" | grep -q "Verifies: true"; then
            echo "[CI/CD] APK уже корректно подписан!"
            cp "$RAW_APK" mobile-artifacts/domofondar.apk
          else
            echo "[CI/CD] APK не подписан или требует выравнивания. Запуск zipalign и apksigner..."
            "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$RAW_APK" mobile-artifacts/aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks mobile/android/app/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --out mobile-artifacts/domofondar.apk \
              mobile-artifacts/aligned.apk
            rm -f mobile-artifacts/aligned.apk
          fi
          
          # Финальная строгая верификация подписи APK (v1 и v2 схемы)
          echo "[CI/CD] Финальная валидация пакета через apksigner:"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose mobile-artifacts/domofondar.apk
          
          # Создаем копию с именем domofondar-app.apk для обратной совместимости
          cp mobile-artifacts/domofondar.apk mobile-artifacts/domofondar-app.apk
          
          # Проверяем наличие JS-бандла внутри архива APK
          echo "[CI/CD] Проверка оффлайн JS-бандла в APK архиве:"
          unzip -l mobile-artifacts/domofondar.apk | grep -E "index.android.bundle|classes.dex" || {
            echo "[CI/CD] ВНИМАНИЕ: Проверка содержимого APK:"
            unzip -l mobile-artifacts/domofondar.apk | head -n 30
          }
          
          echo "[CI/CD] Итоговый размер готового APK:"
          ls -lh mobile-artifacts/domofondar.apk

      # 10. Загрузка готового APK в артефакты сборки GitHub
      - name: 🚀 Сохранение APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: domofondar-apk-bundle
          path: mobile-artifacts/domofondar.apk
          retention-days: 30
          compression-level: 0

      # 11. Публикация готового APK напрямую в GitHub Releases
      #     Позволяет скачать .apk напрямую в 1 клик на смартфон без ZIP-архивов:
      #     https://github.com/keystone4tech-blip/domofondar-revive/releases/latest/download/domofondar.apk
      - name: 📦 Публикация в GitHub Releases (прямая ссылка для смартфонов)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: app-latest
          name: 📱 Мобильное приложение «Домофондар» (Android APK)
          body: |
            ## 📱 Официальное мобильное приложение «Домофондар» для Android
            
            - **Файл:** `domofondar.apk` (чистый установочный пакет, не требует распаковки)
            - **Архитектура:** ARM64 & ARMv7 (поддержка 99.9% современных смартфонов Android 7.0+)
            - **Встроенный оффлайн-бандл:** Да (Hermes Engine, оптимизированная производительность)
            - **Подпись пакета:** Проверена (v1 JAR + v2 APK Signature Scheme)
            
            ### 📥 Как установить на смартфон:
            1. Нажмите на ссылку `domofondar.apk` ниже для прямого скачивания на телефон.
            2. Откройте скачанный файл в шторке уведомлений или папке «Загрузки».
            3. При необходимости разрешите «Установку из неизвестных источников» в настройках Android.
            4. Нажмите **«Установить»** и пользуйтесь!
          files: |
            mobile-artifacts/domofondar.apk
            mobile-artifacts/domofondar-app.apk
          draft: false
          prerelease: false

      # 12. Выкладка APK на боевой сервер — прямая ссылка на скачивание
      #     Итоговый адрес: https://домофондар.рф/media/app/domofondar.apk
      - name: 📲 Загрузка APK на сервер (папка /media/app)
        uses: appleboy/scp-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "mobile-artifacts/domofondar.apk,mobile-artifacts/domofondar-app.apk"
          target: "/opt/domofondar/public/media/app"
          strip_components: 1

      # 13. Проверяем, что APK опубликован на боевом сервере
      - name: 📂 Проверка публикации APK на сервере
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /opt/domofondar/public/media/app
            ls -lh /opt/domofondar/public/media/app/
            echo "Прямая ссылка: https://домофондар.рф/media/app/domofondar.apk"
